[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigilith-stability"
version = "0.1.0"
description = "Structural drift detection across symbolic strings"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
]

[project.scripts]
sigilith-stability = "sigilith_stability.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sigilith_stability*"]
